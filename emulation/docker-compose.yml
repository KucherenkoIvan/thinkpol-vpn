version: '3.8'

services:
  linux-client-emulation:
    build:
      context: ..
      dockerfile: emulation/docker/linux-client-emulation/Dockerfile
    container_name: linux-client-emulation
    privileged: true
    networks:
      - vpn-network
    depends_on:
      - gateway-emulation
    restart: unless-stopped

  gateway-emulation:
    build:
      context: ..
      dockerfile: emulation/docker/gateway-emulation/Dockerfile
    container_name: gateway-emulation
    privileged: true
    ports:
      - "50052:50052"  # Expose transport service port for client connections
    networks:
      - vpn-network
    restart: unless-stopped

networks:
  vpn-network:
    driver: bridge

