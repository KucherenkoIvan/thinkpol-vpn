syntax = "proto3";

package encoding;

option go_package = "thinkpol-vpn/pkg/protocol";

// EncodingService provides bidirectional streaming for packet encoding/decoding
service EncodingService {
  // ProcessPackets streams packets for encoding/decoding
  rpc ProcessPackets(stream EncodingPacket) returns (stream EncodingPacket);
}

// EncodingPacket represents a network packet for encoding service
message EncodingPacket {
  bytes data = 1;  // Packet data
  int32 length = 2; // Length of packet data
}
