syntax = "proto3";

package transport;

option go_package = "thinkpol-vpn/pkg/protocol";

// TransportService provides bidirectional streaming for packet transport
service TransportService {
  // TransportPackets streams packets for transport to/from gateway
  rpc TransportPackets(stream TransportPacket) returns (stream TransportPacket);
}

// TransportPacket represents a network packet for transport service
message TransportPacket {
  bytes data = 1;  // Packet data (should be encoded)
  int32 length = 2; // Length of packet data
}
