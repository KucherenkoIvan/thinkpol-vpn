version: "2"

linters:
  # standard set: errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - misspell
    - depguard
    - forbidigo
  settings:
    # Only in internal/dataplane/path (see exclusions): the path layer is
    # WireGuard's Bind and never opens or holds a socket of its own.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^net\.(Dial\w*|Listen\w*|File\w*Conn|Dialer|ListenConfig|UDPConn|TCPConn|IPConn|UnixConn|UnixListener|TCPListener)$'
          msg: the path layer opens no socket; links come from transports
        - pattern: '^conn\.(NewDefaultBind|NewStdNetBind|StdNetBind)$'
          pkg: '^golang\.zx2c4\.com/wireguard/conn$'
          msg: the path layer is the Bind; WireGuard never gets a socket
        - pattern: '^(syscall|unix|windows)\.'
          msg: the path layer opens no socket
    depguard:
      # Dependency direction from DESIGN.md "Repository layout". Deny entries
      # are prefix matches, so they cover every subpackage.
      rules:
        # the planes run on every node without the controller
        planes-without-control-plane:
          list-mode: lax
          files:
            - "**/internal/dataplane/**"
            - "**/internal/netmap/**"
            - "**/internal/lists/**"
            - "**/internal/shaping/**"
            - "**/internal/agent/**"
          deny:
            - pkg: github.com/KucherenkoIvan/thinkpol-vpn/internal/features
              desc: the node side must not import the control plane
            - pkg: github.com/KucherenkoIvan/thinkpol-vpn/internal/shared
              desc: shared is the control plane's; the node side must not import it
        # the agent drives the data plane, never the other way round
        planes-without-agent:
          list-mode: lax
          files:
            - "**/internal/dataplane/**"
            - "**/internal/netmap/**"
            - "**/internal/lists/**"
            - "**/internal/shaping/**"
          deny:
            - pkg: github.com/KucherenkoIvan/thinkpol-vpn/internal/agent
              desc: the agent drives the data plane; the data plane, the map and the lists never import it
        # pure Go packages that also build for Android
        mobile-without-kernel:
          list-mode: lax
          files:
            - "**/internal/dataplane/**"
            - "**/internal/netmap/**"
            - "**/internal/lists/**"
            - "**/internal/shaping/**"
          deny:
            - pkg: github.com/KucherenkoIvan/go-kernel
              desc: the data plane, the map and the lists stay free of go-kernel
        # the control plane reaches nodes only through the signed map
        features-without-node-side:
          list-mode: lax
          files:
            - "**/internal/features/**"
          deny:
            - pkg: github.com/KucherenkoIvan/thinkpol-vpn/internal/dataplane
              desc: control plane features must not import the data plane
            - pkg: github.com/KucherenkoIvan/thinkpol-vpn/internal/agent
              desc: control plane features must not import the node agent
        shared-without-features:
          list-mode: lax
          files:
            - "**/internal/shared/**"
          deny:
            - pkg: github.com/KucherenkoIvan/thinkpol-vpn/internal/features
              desc: shared code must not depend on a feature
        # the lab drives the product from outside; the product never needs it
        product-without-lab:
          list-mode: lax
          files:
            - "**/cmd/**"
            - "**/internal/**"
          deny:
            - pkg: github.com/KucherenkoIvan/thinkpol-vpn/lab
              desc: the lab harness is for tests driving nodes from outside
        # the map's wire format has one reader and writer
        netmap-schema-only-in-netmap:
          list-mode: lax
          files:
            - $all
            - "!**/internal/netmap/**"
          deny:
            - pkg: github.com/KucherenkoIvan/thinkpol-vpn/proto/gen/thinkpol/netmap
              desc: only internal/netmap encodes or decodes the map; use its types
        # development tooling: hand-made maps are cmd/thinkpol's `dev`
        # commands only; nodes read keys and maps with their own code
        devmap-only-in-cmd:
          list-mode: lax
          files:
            - $all
            - "!**/cmd/thinkpol/**"
            - "!**/internal/devmap/**"
          deny:
            - pkg: github.com/KucherenkoIvan/thinkpol-vpn/internal/devmap
              desc: development tooling, used only by cmd/thinkpol's dev commands
        # Each feature adds a rule denying the other features, e.g.:
        # feature-spaces:
        #   list-mode: lax
        #   files: ["**/internal/features/spaces/**"]
        #   allow: [github.com/KucherenkoIvan/thinkpol-vpn/internal/features/spaces]
        #   deny:
        #     - pkg: github.com/KucherenkoIvan/thinkpol-vpn/internal/features
        #       desc: features talk to each other only through shared/ports
  exclusions:
    generated: lax
    paths:
      - proto/gen
    rules:
      - path-except: internal/dataplane/path/
        linters: [forbidigo]

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - proto/gen
