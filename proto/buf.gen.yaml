version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/KucherenkoIvan/thinkpol-vpn/proto/gen
plugins:
  # pinned in the Makefile, installed into bin/tools by `make tools`
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen
    opt: paths=source_relative
