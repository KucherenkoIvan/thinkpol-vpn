syntax = "proto3";

// The local service API: how the CLI and the tray app control the node
// agent on the same machine, over a Unix socket in a directory of its own
// (docs/design/desktop-client.md "Desktop client"). Nothing in it is a public address, a key
// or a secret (PRD S1, S4): nodes and spaces are opaque ids (hex),
// addresses are the overlay's, and what failed is named from fixed
// vocabularies. The exception is Diagnose's host parts, root's only.
//
// Who may call what is the service's: the socket's directory admits root
// and the `thinkpol` group; every call checks the caller's credentials
// again, and TailLogs is root's only.
package thinkpol.localapi.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

service LocalService {
  // GetStatus reports the node's state.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // WatchStatus sends the status at once, then every interval, until the
  // client goes away or the service stops (the stream then ends cleanly).
  rpc WatchStatus(WatchStatusRequest) returns (stream WatchStatusResponse);
  // Connect brings a device's data plane up on its latest map and returns
  // once it is up. A device removed from its space connects once a map
  // includes it again. Fails with FAILED_PRECONDITION "server_mode" on a
  // server, UNAVAILABLE when the start failed (the message is
  // "start_failed:" and the step's code: "tun", "engine", or an Apply
  // step as in DataPlane.last_apply_error).
  rpc Connect(ConnectRequest) returns (ConnectResponse);
  // Disconnect takes a device's data plane down and returns once it is
  // down; the device goes on following its space's maps.
  rpc Disconnect(DisconnectRequest) returns (DisconnectResponse);
  // ListSpaces lists the spaces the node is enrolled in; one is active.
  rpc ListSpaces(ListSpacesRequest) returns (ListSpacesResponse);
  // SetRulePreset switches the device's routing rules to a preset
  // ("space", the space's own rules; "everything"; "all-but-domestic")
  // and stores the choice in the device's local rules file, which only
  // the service writes. INVALID_ARGUMENT "unknown_rule_preset" for
  // another name; FAILED_PRECONDITION "rule_preset_unavailable" when the
  // space can't build it (the choice is kept, enforced failing closed),
  // "server_mode" on a server.
  rpc SetRulePreset(SetRulePresetRequest) returns (SetRulePresetResponse);
  // TailLogs sends the agent's in-memory log: the last lines, then, when
  // following, every new line until the client goes away or the service
  // stops. Root only: debug lines may quote the map.
  rpc TailLogs(TailLogsRequest) returns (stream TailLogsResponse);
  // Diagnose takes a snapshot of what the node changed on the host and
  // what the host shows of it (`thinkpol diag`), changing nothing. The
  // group gets the parts without public addresses; the rest are root's,
  // and the group's snapshot marks them unreadable.
  rpc Diagnose(DiagnoseRequest) returns (DiagnoseResponse);
}

message GetStatusRequest {}

message GetStatusResponse {
  Status status = 1;
}

message WatchStatusRequest {
  // Between two statuses; at least 250ms, 1s when unset.
  google.protobuf.Duration interval = 1;
}

message WatchStatusResponse {
  Status status = 1;
}

message ConnectRequest {}

message ConnectResponse {
  Status status = 1;
}

message DisconnectRequest {}

message DisconnectResponse {
  Status status = 1;
}

message ListSpacesRequest {}

message ListSpacesResponse {
  repeated Space spaces = 1;
}

message SetRulePresetRequest {
  string preset = 1;
}

message SetRulePresetResponse {
  Status status = 1;
}

message TailLogsRequest {
  // The last lines to send first; 0 sends 100.
  uint32 lines = 1;
  // Keep sending new lines.
  bool follow = 2;
}

message TailLogsResponse {
  // Lines as the agent wrote them; render them sanitized all the same.
  repeated string lines = 1;
  // Lines dropped from the ring before they could be sent.
  uint64 missed = 2;
}

message DiagnoseRequest {}

message DiagnoseResponse {
  Diagnostics diagnostics = 1;
}

// Diagnostics is `thinkpol diag`'s snapshot: the evidence a device run
// records. `thinkpol diag` writes it as JSON with these field names
// (snake_case) and every field present, unset ones as their zero value
// or null. A part the agent couldn't read has `unreadable` set to why,
// and nothing else; a part without it was read, and what it lists is all
// there is. No key, token or session id is in it; endpoints and
// addresses are, in the host parts, which only root gets.
message Diagnostics {
  // The schema. Bumped when a field is removed or renamed or its type or
  // meaning changes; not when a field is added. `unreadable` texts are
  // free-form, and the values of enumerated strings (a route's type, an
  // Apply's step) may grow without a bump.
  uint32 schema_version = 1;
  google.protobuf.Timestamp taken_at = 2;
  // The agent's OS ("linux", "darwin") and version.
  string os = 3;
  string agent_version = 4;
  // The caller got the host parts (routes, policy_rules, guard, dns):
  // root and the service's user do; the group's snapshot has them
  // unreadable.
  bool host_parts = 5;
  // The status GetStatus serves.
  Status status = 6;
  // The overlay's TUN as the host reports it.
  DiagInterface tun = 7;
  // The device's data plane's last Apply: its steps with their timings.
  DiagApply last_apply = 8;
  // The routes and policy rules the agent's owners hold, as the kernel
  // reports them, whether or not the data plane runs (a crash's show
  // too). Host parts.
  DiagRoutes routes = 9;
  DiagRules policy_rules = 10;
  // The IPv6 leak guard as the host holds it. A host part.
  DiagGuard guard = 11;
  // The resolvers the host uses, for the overlay's names and the rest, as
  // it reports them (Linux: resolv.conf and systemd-resolved; macOS:
  // scutil --dns). A host part.
  DiagDns dns = 12;
}

// An interface as the host reports it.
message DiagInterface {
  string unreadable = 1;
  string name = 2;
  uint32 index = 3;
  uint32 mtu = 4;
  // Administratively up, and running (the OS's IFF_UP, IFF_RUNNING).
  bool up = 5;
  bool running = 6;
  // Its addresses, each with its prefix length.
  repeated string addresses = 7;
}

// An Apply of a map's section by a device's data plane.
message DiagApply {
  string unreadable = 1;
  google.protobuf.Timestamp started = 2;
  google.protobuf.Duration took = 3;
  // The step it failed at, as DataPlane.last_apply_error; "" when it
  // didn't.
  string failed = 4;
  // In the order they ran; a step's time runs from the end of the one
  // before it.
  repeated DiagApplyStep steps = 5;
}

message DiagApplyStep {
  // A step of DataPlane.last_apply_error's vocabulary, or "rules"
  // (compiling the routing rules) or "route_table_shrink" (the direct
  // routes taken out first), neither of which fails an Apply.
  string step = 1;
  google.protobuf.Duration took = 2;
  bool failed = 3;
}

message DiagRoutes {
  string unreadable = 1;
  repeated DiagRoute routes = 2;
  // macOS: routes carrying RTF_PROTO2, the flag the agent's owners mark
  // theirs with, that no owner's record names: another program's, or
  // what an agent left without recording it (owner "").
  repeated DiagRoute unrecorded_proto2 = 3;
}

// A route one of the agent's owners holds.
message DiagRoute {
  // "overlay", "supervisor", "route-table".
  string owner = 1;
  // "IPv4", "IPv6".
  string family = 2;
  string destination = 3;
  // The kernel's type: "unicast", "throw", "unreachable", "blackhole",
  // "prohibit", or its number.
  string type = 4;
  string gateway = 5;
  string interface = 6;
  // The kernel's metric and table (Linux: 254 is main); 0 on macOS.
  uint32 metric = 7;
  uint32 table = 8;
  // The interface a scoped route (macOS RTF_IFSCOPE) is scoped to.
  string scope = 9;
}

message DiagRules {
  string unreadable = 1;
  repeated DiagRule rules = 2;
}

// A policy rule one of the agent's owners holds (Linux; macOS has none).
message DiagRule {
  string owner = 1;
  string family = 2;
  uint32 priority = 3;
  uint32 table = 4;
  string destination = 5;
  string oif = 6;
  // `fwmark mark/mask`.
  uint32 mark = 7;
  uint32 mask = 8;
  bool invert = 9;
  // `suppress_prefixlength`; -1 without one.
  int32 suppress_prefixlen = 10;
  // What the rule does: "lookup" (in table), "goto", "nop", "blackhole",
  // "unreachable", "prohibit", or the kernel's number.
  string action = 11;
  // The rule has a selector the agent never sets, which this doesn't
  // show.
  bool other = 12;
}

// The IPv6 leak guard as the host holds it.
message DiagGuard {
  string unreadable = 1;
  // "nftables table inet thinkpol-guard", "pf anchor
  // com.apple/000.thinkpol".
  string where = 2;
  // The host holds the guard (the table exists; the anchor lists rules).
  // Left out when that couldn't be told (the anchor's rules unreadable).
  optional bool present = 3;
  DiagGuardRules rules = 4;
  // What the guard lets out by destination, as the fewest prefixes.
  DiagPrefixes exempt = 5;
  DiagNftables nftables = 6;
  DiagPf pf = 7;
}

message DiagGuardRules {
  string unreadable = 1;
  repeated DiagGuardRule rules = 2;
}

// A rule of the guard as the host lists it, with its counters.
message DiagGuardRule {
  // The nftables chain (Linux).
  string chain = 1;
  // pfctl's line (macOS); on Linux the expressions rendered nft-like
  // (raw payloads as `@nh,192,128`; an expression it doesn't know shows
  // as its type).
  string text = 2;
  // The rule has counters (Linux: a counter expression).
  bool counted = 3;
  uint64 packets = 4;
  uint64 bytes = 5;
  // pf's (macOS).
  uint64 evaluations = 6;
  uint64 states = 7;
}

message DiagPrefixes {
  string unreadable = 1;
  repeated string prefixes = 2;
}

// The guard table's own state (Linux).
message DiagNftables {
  // The table's chains are unhooked: it guards nothing.
  bool dormant = 1;
  string chains_unreadable = 2;
  repeated DiagNftChain chains = 3;
}

message DiagNftChain {
  string name = 1;
  // A base chain's hook ("output"), priority and policy.
  string hook = 2;
  int32 priority = 3;
  string policy = 4;
}

// pf's state as it concerns the guard (macOS).
message DiagPf {
  DiagPfEnabled enabled = 1;
  DiagPfGuardCheck guard_check = 2;
  DiagPfReference reference = 3;
}

message DiagPfEnabled {
  string unreadable = 1;
  bool enabled = 2;
}

// What pf's listings show of how its main ruleset reaches the anchor.
message DiagPfGuardCheck {
  string unreadable = 1;
  // The guard's own check of the main ruleset: "hooked" (`anchor
  // "com.apple/*"` reached), "bypassed" (a quick pass above it may end
  // evaluation first), "missing" (no such anchor rule).
  string state = 2;
  // Its evidence: the main ruleset's lines up to the hook (all of them
  // without one).
  repeated string main_rules = 3;
  // Every interface pf skips (`set skip on`), and the anchors under
  // com.apple that sort before the guard's.
  repeated string skipped = 4;
  repeated string anchors_before = 5;
}

// The guard's `pfctl -E` reference, by the pid of the pfctl that took it.
message DiagPfReference {
  string unreadable = 1;
  // The guard's record names a reference.
  bool recorded = 2;
  // A record of another boot session: it holds nothing now.
  bool stale = 3;
  uint32 pid = 4;
  // The record names it by the pid alone (its value not read yet).
  bool pid_only = 5;
  // pf lists it as taken by that pid; held_unreadable says why pf's
  // listing couldn't tell.
  bool held = 6;
  string held_unreadable = 7;
}

message DiagDns {
  string unreadable = 1;
  repeated DiagDnsSource sources = 2;
}

// One place the OS keeps resolvers: "resolv.conf", "systemd-resolved",
// "scutil --dns".
message DiagDnsSource {
  string name = 1;
  string unreadable = 2;
  // The source is there (systemd-resolved runs; resolv.conf exists).
  bool present = 3;
  repeated DiagResolver resolvers = 4;
}

// A resolver configuration the OS holds.
message DiagResolver {
  // The link it is for (a systemd-resolved link, scutil's if_index); ""
  // for a global one.
  string interface = 1;
  // scutil lists it for queries scoped to the interface only.
  bool scoped = 2;
  repeated string servers = 3;
  // The names it is asked for: systemd-resolved's domains as it reports
  // them ("~" before a routing-only one; "~." takes every name);
  // scutil's match domain.
  repeated string domains = 4;
  // Search domains (resolv.conf, scutil).
  repeated string search = 5;
  // scutil's order, flags and reach; resolv.conf's or scutil's options.
  uint32 order = 6;
  string flags = 7;
  string reach = 8;
  repeated string options = 9;
  // resolv.conf is the node's own rewrite (the original in comments).
  bool node_written = 10;
}

// A space the node is enrolled in. Names are the controller's: a node
// knows its spaces by id.
message Space {
  string id = 1;
  bool active = 2;
}

message Status {
  Mode mode = 1;
  // The active space.
  string space_id = 2;
  // The version of the map the node follows.
  uint64 map_version = 3;
  // The map has no section for the node: it was removed from the space.
  bool removed = 4;
  Connection connection = 5;
  // A start, an Apply or serving the map failed and is retried.
  bool retrying = 6;
  Health health = 7;
  // A device's data plane, while it is up.
  DataPlane data_plane = 8;
  // A server's workers, one per space, and its public listeners.
  repeated Worker workers = 9;
  repeated PublicListener public_listeners = 10;
  // A device's rule preset, from its local rules file ("space" when it
  // has none), and whether its data plane enforces it yet.
  string rule_preset = 11;
  bool rules_enforced = 12;
  // The map can't build the preset (no chain, or no domestic list): it is
  // enforced failing closed until it can.
  bool rule_preset_unavailable = 13;
  // A server's uplink and what it carries.
  Uplink uplink = 14;
  // The maps the node was given and refused since it started: invalid,
  // or not its space's (one merely not newer, the same map read again,
  // isn't counted). One that keeps growing is someone handing it maps it
  // refuses.
  uint64 maps_refused = 15;
}

// Uplink is a server's way to the internet, for its spaces that allow
// egress.
message Uplink {
  // The interface of the node's default route; empty without one (error
  // says why), and then no space has egress.
  string interface = 1;
  bool ipv4 = 2;
  bool ipv6 = 3;
  // Whether the node forwards each family.
  bool forwarding4 = 4;
  bool forwarding6 = 5;
  // Why there is no uplink, a code: "no_default_route",
  // "uplink_unusable", "uplink_unknown", "unsupported".
  string error = 6;
}

enum Mode {
  MODE_UNSPECIFIED = 0; // removed from its space, kind unknown
  MODE_DEVICE = 1;
  MODE_SERVER = 2;
}

enum Connection {
  CONNECTION_UNSPECIFIED = 0;
  CONNECTION_DISCONNECTED = 1;
  // Meant to be connected, data plane not up (removed, or retrying).
  CONNECTION_CONNECTING = 2;
  CONNECTION_CONNECTED = 3;
  // A server, which serves its spaces whenever it runs.
  CONNECTION_SERVING = 4;
}

message Health {
  HealthLevel level = 1;
  // What is wrong, worst first, from a fixed vocabulary (e.g.
  // "disconnected", "no_link_up", "apply_failed", "worker_down").
  repeated string problems = 2;
}

enum HealthLevel {
  HEALTH_LEVEL_UNSPECIFIED = 0;
  HEALTH_LEVEL_OK = 1;
  HEALTH_LEVEL_DEGRADED = 2;
  HEALTH_LEVEL_DOWN = 3;
}

message DataPlane {
  // The overlay's MTU.
  uint32 mtu = 1;
  // Whether the overlay carries IPv6, and if not, why, a code:
  // "mtu_below_1280", "no_ipv6_address", "other".
  bool ipv6 = 2;
  string ipv6_off = 3;
  // The step the last Apply failed at, a code ("section", "removals",
  // "interface", "devices", "router", "route_table"), empty if it
  // succeeded.
  string last_apply_error = 4;
  repeated Peer peers = 5;
  repeated Neighbor neighbors = 6;
  // One per WireGuard device: "overlay", and a chain's name per chain
  // (TP-030).
  repeated Egress egresses = 7;
  // What the map held that the node left out, and why.
  repeated Skip skipped = 8;
  // The listeners the device serves.
  uint32 listeners = 9;
  // The router's and the path layer's counters by name ("router.no_route",
  // "path.no_path", ...), and the route table's ("route_table.routes",
  // "route_table.reapplies", "route_table.rules_ahead") while it enforces
  // the rules, and how often the overlay interface was re-applied after its
  // link came up ("interface.reapplies").
  map<string, uint64> counters = 10;
}

// A WireGuard peer.
message Peer {
  string node_id = 1;
  // The WireGuard device (egress) it is on.
  string device = 2;
  // Its overlay addresses.
  repeated string addresses = 3;
  // The node its packets leave through now (the entry in use, or the
  // peer itself); empty before the first packet or without a path.
  string first_hop = 4;
  google.protobuf.Timestamp last_handshake = 5;
  uint64 rx_bytes = 6;
  uint64 tx_bytes = 7;
}

// An adjacent node and the links to it.
message Neighbor {
  string node_id = 1;
  bool up = 2;
  google.protobuf.Duration up_for = 3;
  google.protobuf.Duration rtt = 4;
  // This node dials it.
  bool dialed = 5;
  repeated Link links = 6;
}

message Link {
  string transport = 1;
  bool dialed = 2;
  // Which of the map's endpoints of the link was dialed; -1 for a link
  // the neighbor dialed.
  int32 endpoint = 3;
  // The link the neighbor's traffic goes out on.
  bool active = 4;
  bool up = 5;
  google.protobuf.Duration up_for = 6;
  google.protobuf.Duration rtt = 7;
  uint64 packets_in = 8;
  uint64 packets_out = 9;
  uint64 bytes_in = 10;
  uint64 bytes_out = 11;
  uint64 queue_full = 12;
}

// One WireGuard device's egress from the router; its counts are packets.
message Egress {
  string name = 1;
  uint32 mtu = 2;
  uint32 queued = 3;
  uint64 routed = 4;
  uint64 delivered = 5;
  uint64 not_local = 6;
  uint64 queue_full = 7;
  uint64 too_large = 8;
}

message Skip {
  string node_id = 1;
  // "link", "endpoint", "inbound link", "route", "hop", "peer".
  string item = 2;
  string reason = 3;
}

// One space's worker on a server.
message Worker {
  string space_id = 1;
  bool ready = 2;
  // Processes so far; more than one means it was restarted.
  uint32 starts = 3;
  google.protobuf.Timestamp ready_since = 4;
  // When a restart after a crash is due.
  google.protobuf.Timestamp restart_at = 5;
  // Why the last process ended, a code: "spawn_failed", "not_ready",
  // "unresponsive", "protocol_error", "killed", "exited". The service's
  // log has the detail.
  string last_exit = 6;
}

// One of a server's public listeners, without its address.
message PublicListener {
  string transport = 1;
  uint64 routed = 2;
  uint64 unauthenticated = 3;
  uint64 no_space = 4;
  uint64 streams_overloaded = 5;
  // Peer links the transport refused to route.
  uint32 rejected = 6;
}
