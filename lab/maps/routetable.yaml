# The route-table lab map (TP-018): device-a picks "all but domestic" in its
# own rules file; the space's domestic list DM_LIST holds a "domestic" site
# (on the internet node), and its chain exits at server-1. Development
# tooling; the format is in `thinkpol dev map spec`.
#
#   thinkpol dev keygen space -out keys
#   thinkpol dev keygen node -out keys server-1 device-a device-b
#   thinkpol dev lists build -only dm -out lists domestic.csv
#   SERVER_1_IPV4=... SERVER_1_IPV6=... DM_LIST=$PWD/lists/dm.geoip \
#     thinkpol dev map build -keys keys -out map.bin lab/maps/routetable.yaml

lists:
  - name: dm
    file: ${DM_LIST}

nodes:
  - name: server-1
    kind: server
    endpoints:
      - udp://${SERVER_1_IPV4}:4500
      - udp://[${SERVER_1_IPV6}]:4500
    ingress: true
    egress: true
  - name: device-a
    kind: device
    lists: [dm]

paths:
  - [device-a, server-1]

chains:
  - name: abroad
    exit: server-1

rules:
  - default -> chain:abroad

presets:
  domestic: dm
  chain: abroad
