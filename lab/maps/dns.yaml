# The DNS lab map (TP-020): device-a and device-b reach server-1, the exit
# of the space's only chain, and each other through it. Names under
# direct.test resolve directly, blocked.test nowhere, everything else
# through the tunnel at server-1. Development tooling; the format is in
# `thinkpol dev map spec`.
#
# Set SERVER_1_IPV4 to server-1's address on the servers network:
#
#   thinkpol dev keygen space -out keys
#   thinkpol dev keygen node -out keys server-1 device-a device-b
#   SERVER_1_IPV4=... thinkpol dev map build -keys keys -out map.bin lab/maps/dns.yaml

space:
  name: lab

nodes:
  - name: server-1
    kind: server
    endpoints:
      - udp://${SERVER_1_IPV4}:4500
    ingress: true
    egress: true
  - name: device-a
    kind: device
  - name: device-b
    kind: device

paths:
  - [device-a, server-1]
  - [device-b, server-1]
  - [device-a, server-1, device-b]

rules:
  - local -> direct
  - domain-suffix:direct.test -> direct
  - domain:blocked.test -> block
  - default -> chain:out

chains:
  - name: out
    exit: server-1
