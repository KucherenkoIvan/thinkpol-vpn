# The M0 lab map (TP-012): device-a and device-b reach server-1 directly and
# each other through server-1, over IPv4 and IPv6. Development tooling; the
# format is in `thinkpol dev map spec`.
#
# server-1's addresses are Docker's, known once the lab is up: set
# SERVER_1_IPV4 and SERVER_1_IPV6 to its addresses on the servers network.
#
#   thinkpol dev keygen space -out keys
#   thinkpol dev keygen node -out keys server-1 device-a device-b
#   SERVER_1_IPV4=... SERVER_1_IPV6=... thinkpol dev map build -keys keys -out map.bin lab/maps/m0.yaml
#
# Each node then gets map.bin, keys/space.pub and its own keys/<name>.key.

nodes:
  - name: server-1
    kind: server
    endpoints:
      - udp://${SERVER_1_IPV4}:4500
      - udp://[${SERVER_1_IPV6}]:4500
  - name: device-a
    kind: device
  - name: device-b
    kind: device

paths:
  - [device-a, server-1]
  - [device-b, server-1]
  - [device-a, server-1, device-b]
